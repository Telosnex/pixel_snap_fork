name: Unit

on:
  pull_request:
    branches: [main]
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
      - uses: Telosnex/telosnex_ci_tools/actions/lint@bba81d85dab7716cc288df9877812dd3299ff11e # v0.5.14
      # flutter pub get resolves example/ too; the root analyze also reads
      # generator/.
      - run: flutter pub get && (cd generator && flutter pub get)
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test -r expanded
      - run: flutter analyze --fatal-infos && flutter test -r expanded
        working-directory: example
      # The generator's tests include a check that lib/src/generated matches
      # what the generator makes from this Flutter.
      - run: dart analyze --fatal-infos && dart test -r expanded
        working-directory: generator
      - run: dart run bin/forks.dart check
        working-directory: generator
